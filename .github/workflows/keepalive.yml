name: Keep Railway awake

on:
  schedule:
    # Every 5 minutes, around the clock. Railway's Hobby tier sleeps the
    # instance after ~15-30 min of inactivity, and waking up costs a 3-5s
    # cold DB handshake on the next user request. Pinging /health keeps it
    # warm so the first real user request is fast.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway health endpoint
        run: |
          curl -sS -o /dev/null -w "health status=%{http_code} time=%{time_total}s\n" \
            https://marketplace-production-2905.up.railway.app/health
